# Fresh arm0_96 nucleus-aware decode after fixing silent HDF5 seam zero-fill.
# The v1 scratch is intentionally not reused: any atomic watershed child made
# by the old NFS-directory reader is considered contaminated.
seuron_replay:
  provenance_path: /projects/weilab/weidf/lib/pytorch_connectomics/dev/zebrafinch/seuron_provenance.json
  backend: abiss_local
  data: local

  out_root: /projects/weilab/weidf/lib/pytorch_connectomics/dev/zebrafinch/wholevol_arm096_nuc_competitive_v2
  name: seg_arm096_nuc_competitive_v2
  secrets_dir: ~/.cloudvolume/secrets
  abiss_home: /projects/weilab/weidf/lib/pytorch_connectomics/lib/abiss

  aff_path: /projects/weilab/weidf/lib/pytorch_connectomics/outputs/nisb_base_banis_plus_zebrafinch_heavy/20260726_114349/test_step=00200000/0/raw_x1_ch0-1-2_chunked-raw_cs1008x1008x1008_halo72x72x72_zebrafinch_chunk_raw_grid1008_halo72.h5.chunks

  param_overrides:
    AFF_CONVENTION: banis
    AFF_RESTORE_SIGMOID: 0.2
    AFF_KEEP_MASK: /projects/weilab/weidf/lib/pytorch_connectomics/dev/zebrafinch/tissue_border_keep_mask_full.zarr

    NUC_PATH: /projects/weilab/dataset/zebrafinch/yl_cb_80nm_neuron_v2.h5
    NUC_RATIO: [4, 8, 8]
    NUC_OFFSET: [0, 0, 0]
    NUC_MIN_SHARE: 0.02
    NUC_CONTACT_UM: 8.0
    NUC_COMPETITION_MARGIN_ZYX: [1024, 1024, 512]
    NUC_COMPETITION_FACTOR: 4

    ABISS_NUC_DOMINANCE: 0.6
    ABISS_NUC_MIN_TAGGED: 50
