# Fresh arm2_ft_mix ch3-5 nucleus-aware decode after fixing silent HDF5 seam
# zero-fill. The stopped v1 scratch is intentionally not reused.
seuron_replay:
  provenance_path: /projects/weilab/weidf/lib/pytorch_connectomics/dev/zebrafinch/seuron_provenance.json
  backend: abiss_local
  data: local

  out_root: /projects/weilab/weidf/lib/pytorch_connectomics/dev/zebrafinch/wholevol_arm2mix_r10_nuc_competitive_v2
  name: seg_arm2mix_r10_nuc_competitive_v2
  secrets_dir: ~/.cloudvolume/secrets
  abiss_home: /projects/weilab/weidf/lib/pytorch_connectomics/lib/abiss

  aff_path: /projects/weilab/weidf/lib/pytorch_connectomics/outputs/nisb_base_banis_v3_erosion2_zebrafinch_ft_mix/20260727_131157/test_step=00100000/0/raw_x1_ch0-1-2-3-4-5_chunked-raw_cs1008x1008x1008_halo72x72x72_zebrafinch_chunk_raw_grid1008_halo72.h5.chunks

  param_overrides:
    AFF_CHANNELS: [3, 4, 5]
    AFF_CONVENTION: banis
    AFF_RESTORE_SIGMOID: 0.2
    AFF_KEEP_MASK: /projects/weilab/weidf/lib/pytorch_connectomics/dev/zebrafinch/tissue_border_keep_mask_full.zarr

    NUC_PATH: /projects/weilab/dataset/zebrafinch/yl_cb_80nm_neuron_v2.h5
    NUC_RATIO: [4, 8, 8]
    NUC_OFFSET: [0, 0, 0]
    NUC_MIN_SHARE: 0.02
    NUC_CONTACT_UM: 8.0
    NUC_COMPETITION_MARGIN_ZYX: [1024, 1024, 512]
    NUC_COMPETITION_FACTOR: 4
    NUC_COMPETITION_AFF_CHANNELS: [0, 1, 2]

    ABISS_NUC_DOMINANCE: 0.6
    ABISS_NUC_MIN_TAGGED: 50
