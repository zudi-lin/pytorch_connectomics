_base_:
  - liconn_banis_v3_erosion2.yaml

# Isotropic 2x (read 69^3 native -> upsample to 138^3 -> model 128^3 at 2x-iso).
#
# Mechanism (uses the new data.dataloader.read_downscale read optimization):
#   effective_patch_size = patch_size 128 + target_context post 10 = 138^3.
#   read_downscale 0.5 makes the dataset READ a round(138*0.5)=69^3 NATIVE crop
#   (instead of 138^3); data_transform.resize=[138,138,138] then upsamples it
#   back to 138^3 (bilinear image / nearest label+aux) BEFORE the no-op
#   SpatialPad+RandSpatialCrop(138), erosion=2, and the affinity targets.
#   LeadingSpatialCrop then trims the target_context margin -> model sees 128^3
#   at 2x-isotropic resolution covering 64x64x64 native voxels. The r10 affinity
#   context is preserved (10 voxels in the 2x grid = 5 native; 69 = 64 FOV + 5).
#   model.input_size stays [128,128,128] == patch_size so preflight passes.
#
# Why read_downscale and not resize-up-from-full: reading 69^3 instead of 138^3
# drops the per-sample zarr disk read + gzip decompress ~8x (0.5^3) for an
# IDENTICAL training target distribution to "read 138 + resize 276 + crop 138".
#
# erosion=2 NOTE: the label is upsampled 2x with NEAREST, so erosion=2 on the
# 2x-iso grid is topologically == native erosion=1 on the label -- a proven
# no-op on the label content. The real difference vs the native run is the
# bilinear 2x INPUT image; this run tests whether finer isotropic input helps
# liconn's thin processes survive the affinity target.
#
# Decode unchanged (aff ch0:3) -- directly comparable to
# liconn_banis_v3_erosion2 (test NERL 0.211), modulo the test-side 2x handling.

experiment_name: nisb_liconn_banis_v3_x2y2z2_erosion2

save_path: outputs/nisb_liconn_banis_v3_x2y2z2_erosion2

default:
  data:
    dataloader:
      patch_size: [128, 128, 128]
      # Read a half-size native crop (round(138*0.5)=69^3) and upsample it back
      # via data_transform.resize below. 1.0 (default) would be a no-op.
      read_downscale: 0.5
    data_transform:
      # MUST equal the effective patch size (patch_size 128 + target_context 10
      # = 138) so the 69^3 native read is upsampled back exactly to 138^3.
      # Image bilinear, label/mask/label_aux nearest (handled in build.py).
      resize: [138, 138, 138]
    label_transform:
      erosion: 2

model:
  input_size: [128, 128, 128]
