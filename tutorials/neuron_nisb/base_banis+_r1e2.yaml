_base_:
  - base_banis+.yaml

experiment_name: nisb_base_banis_plus_r1e2
description: >-
  Variant b.2 of the multi-scale-affinity / no-erosion line. Same intent as
  base_banis+_r3, but instead of a mid-range r3 channel the boundary-scale
  signal is supplied by an EXPLICIT eroded r1 channel: r1 on the lossless GT
  (erosion=0, exact connectivity) PLUS a second r1 computed on an erosion=2
  copy of the GT (the cc3d-safe membrane margin that classic banis+ baked into
  the single r1 target, now a dedicated channel that does not destroy the
  lossless r1), PLUS long-range r10. Uses the per-target erosion feature
  (kwargs.erosion per affinity target; global label erosion stays 0). Trains on
  seg_filled. 9-channel single affinity head, otherwise the proven banis+ recipe
  (MedNeXt-L/k3, PerChannelBCE + EMA, 200k cosine). Decode keeps cc3d on the
  lossless r1 channels [0,1,2] for now; channels 3:9 (eroded-r1, r10) are meant
  to feed an agglomeration decode (waterz) in a follow-up.

save_path: outputs/nisb_base_banis_plus_r1e2

default:
  model:
    # r1@erosion0 (3) + r1@erosion2 (3) + r10@erosion0 (3) = 9 affinity channels.
    out_channels: 9
  data:
    label_transform:
      # Global erosion OFF; each affinity target carries its own per-target
      # erosion below (requires global=0 since global erosion is destructive).
      erosion: 0
      targets:
        # ch0:3 — r1 on the LOSSLESS GT (exact thin-neurite connectivity).
        - name: affinity
          kwargs:
            offsets: ["1-0-0", "0-1-0", "0-0-1"]
            affinity_mode: banis
            erosion: 0
        # ch3:6 — r1 on an erosion=2 copy (explicit cc3d-safe membrane margin).
        - name: affinity
          kwargs:
            offsets: ["1-0-0", "0-1-0", "0-0-1"]
            affinity_mode: banis
            erosion: 2
        # ch6:9 — long-range r10 on the lossless GT (agglomeration context).
        - name: affinity
          kwargs:
            offsets: ["10-0-0", "0-10-0", "0-0-10"]
            affinity_mode: banis
            erosion: 0

# Train/val label paths live in the `train:` stage block in the base config, so
# the seg_filled override must go here (a `default.data.train` override is
# clobbered by the stage-specific value during stage resolution).
train:
  data:
    train:
      label: seed*/data.zarr/seg_filled
    val:
      label: seed100/data.zarr/seg_filled
