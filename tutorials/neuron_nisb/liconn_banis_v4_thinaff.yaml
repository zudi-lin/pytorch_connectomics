_base_:
  - liconn_banis_v3_erosion2.yaml

experiment_name: nisb_liconn_banis_v4_thinaff
description: >-
  banis+ erosion=2 on LICONN with a CALIBER-WEIGHTED affinity loss. Identical to
  liconn_banis_v3_erosion2 in every other respect (MedNeXt-L/k3, 6-ch r1+r10
  affinity, per-channel BCE + EMA, 200k cosine, erosion=2, cc3d ch0:3 decode), so
  the comparison against its 0.211 test / 0.228 val anchor is controlled.

  WHY (all measured on the published seed6 artifacts, 2026-07-27):

  * dev/nisb/liconn/coverage_probe.py -- the "27% of GT skeleton nodes land on
    background" that has framed this track is a THRESHOLD artifact, not a
    prediction failure. Those nodes carry a median max incident affinity of
    0.628 against a 0.70 decode threshold; 99.6% are above 0.3 and 79% above 0.5.
    The model sees the thin processes and then the decoder throws them away.
  * dev/nisb/liconn/affinity_separability.py -- the predicted affinity on TRUE
    same-instance edges falls with caliber (median 0.52 below 27 nm, 0.62, 0.67,
    0.74 above 72 nm) while CROSS-instance edges sit flat at median 0.36 / p95
    0.51 at every caliber. Per-caliber AUC is 0.877 (thin) to 0.993 (thick). So
    the ranking is usable but the calibration is caliber-dependent, and the one
    global threshold that is safe against cross-instance edges is above the
    same-instance median of every band below 72 nm.
  * dev/nisb/liconn/erosion_target_probe.py -- this is NOT the erosion target's
    doing: erosion=2 zeroes only 5.6% of thin same-instance edges (0.19% thick).
    The hedging is the model's own response to low local SNR.

  The mismatch is objective-vs-metric: class-balanced BCE counts voxels, which
  the thick trunks dominate, while NERL counts skeleton LENGTH, which the thin
  processes dominate. `thin_affinity_weight` re-weights each TRUE same-instance
  edge by how thin its process is (w = 1 + (max_weight-1)*clip((r_ref-r)/r_ref)),
  leaving cross-instance edges at weight 1 so the pressure is one-sided: raise
  confidence on genuine thin continuations without teaching the model to connect
  across a membrane.

  radius_ref 72 nm is the caliber above which the measured same-instance median
  already clears the threshold; max_weight 4.0 is ~log 4 = 1.4 of logit headroom,
  enough to lift a 0.52 median past 0.70 if the deficit is a prior and not
  irreducible ambiguity. resolution [9,9,12] is the volume's TRUE voxel size in
  the (X, Y, Z) array order the BANIS pipeline keeps on disk -- note this is NOT
  the [18,18,25] the data section declares (see projects/2026_nisb_liconn
  lessons; the GT itself was built at [9,9,12]).

  GATE vs the erosion2 anchor: tuned-val NERL > 0.228, test > 0.211, AND the
  fraction of GT skeleton nodes on background below 25%, AND the number of
  predicted labels owning >=2 GT skeletons not increased.
  KILL: coverage unchanged (the deficit is irreducible ambiguity, not a prior),
  or merges up (the weight leaked onto cross-instance edges).

save_path: outputs/nisb_liconn_banis_v4_thinaff

default:
  data:
    label_transform:
      # Global erosion stays 2 so the affinity target is bit-identical to the
      # anchor. thin_affinity_weight reads the same eroded label, so its caliber
      # and the affinity target agree edge for edge.
      erosion: 2
      targets:
        # ch0:6 -- the anchor's affinity target, unchanged.
        - name: affinity
          kwargs:
            offsets: ["1-0-0", "0-1-0", "0-0-1", "10-0-0", "0-10-0", "0-0-10"]
            affinity_mode: banis
        # ch6:12 -- per-edge loss weight, NOT a prediction target. The model
        # still emits 6 channels; the loss reads this through mask_slice.
        - name: thin_affinity_weight
          kwargs:
            offsets: ["1-0-0", "0-1-0", "0-0-1", "10-0-0", "0-10-0", "0-0-10"]
            affinity_mode: banis
            resolution: [9.0, 9.0, 12.0]
            radius_ref: 72.0
            max_weight: 4.0
            include_negative: false
  model:
    loss:
      deep_supervision: false
      losses:
        - function: PerChannelBCEWithLogitsLoss
          weight: 1.0
          target_slice: "0:6"
          # The orchestrator multiplies this into the affinity valid mask, so
          # invalid edges stay masked and valid ones get the caliber weight.
          mask_slice: "6:12"
          kwargs:
            auto_pos_weight: true
            max_pos_weight: 10.0
