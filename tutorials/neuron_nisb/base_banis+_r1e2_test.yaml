_base_:
  - base_banis+_r1e2.yaml

experiment_name: nisb_base_banis_plus_r1e2_test
description: >-
  WHOLE-VOLUME test of nisb_base_banis_plus_r1e2 on seed101 (3000x3000x1350).
  Decodes cc3d on the r1@erosion2 channels (the eroded-r1 membrane-margin head),
  which on the 988 crop scored NERL 0.745 vs the r3 head's 0.555. To keep the
  saved prediction small (~55 GB, 3 ch like the SDT run), inference selects only
  channels [3,4,5] (the r1@ero2 affinities), stored as channels 0,1,2 in the
  output; cc3d then decodes the first 3 channels directly. Same affinity_mask +
  full skeleton.pkl as the banis+ baseline (cc3d@0.66 = 0.601) for a fair
  whole-volume comparison. Threshold 0.66 to match the baseline optimum (r1@ero2
  is analogous to the baseline's eroded r1).

save_path: outputs/nisb_base_banis_plus_r1e2

default:
  inference:
    model:
      # Save only the r1@erosion2 channels (3,4,5) -> stored as 0,1,2.
      select_channel: [3, 4, 5]
  decoding:
    steps:
      - name: decode_affinity_cc
        kwargs:
          # First 3 saved channels == the r1@ero2 affinities.
          threshold: 0.66
          backend: numba
          edge_offset: 0
  # evaluation.metrics: [nerl] and the whole-volume test block (path, skeleton,
  # affinity_mask) are inherited from base_banis.yaml.
