_base_:
  - liconn_banis_v3_erosion2.yaml

experiment_name: nisb_liconn_banis_v3_2xxy_erosion2
description: >-
  LICONN banis+ (MedNeXt-L/k3, 6-ch r1+r10 affinity) trained at 2x-XY
  resolution with label erosion=2. Motivation: liconn processes are thin
  (median per-GT NERL 0.24, 27% of skeleton nodes land on bg in the cc3d
  decode); native erosion=2 (Kisuk XY-only, 5x5 window) erases thin
  cross-sections from the affinity target, so the model is trained to
  predict background there -> coverage loss + splits. Upsampling 2x on the
  two fine in-plane axes (X,Y) BEFORE erosion makes each process 2x thicker
  in XY, so erosion=2 in the 2x grid removes a smaller fraction and thin
  processes survive in the target -- while still cutting a separating gap
  between touching processes (the merge lever liconn needs).

  Mechanism (no code change): the dataset reads a patch_size=[128,128,128]
  native crop; data_transform.resize=[256,256,128] upsamples X,Y 2x
  (bilinear image / nearest label+aux) BEFORE the RandSpatialCrop back to
  [128,128,128]; erosion=2 and the affinity targets are then computed on the
  upsampled-then-cropped label. Net: the model sees a 128^3 window at 2x-XY
  resolution covering 64x64x128 native voxels. model.input_size stays
  [128,128,128] == patch_size so preflight passes. Z (12nm) is left native;
  liconn is near-isotropic ([9,9,12]nm) so an isotropic-2x variant
  (resize [256,256,256]) is a reasonable follow-up.

  Decode unchanged (aff ch0:3) -- directly comparable to
  liconn_banis_v3_erosion2 (test NERL 0.211). Gate before training:
  dev/nisb/liconn/erosion2x_gate.py (skeleton-node survival under
  native-ero2 vs 2xXY-ero2).

save_path: outputs/nisb_liconn_banis_v3_2xxy_erosion2

default:
  data:
    dataloader:
      patch_size: [128, 128, 128]
    data_transform:
      # Upsample the two fine in-plane axes (X,Y) 2x before crop+erosion.
      # Image bilinear, label/mask/label_aux nearest (handled in build.py).
      # NOTE: the dataset crops _effective_patch_size = patch_size + target_context
      # = 138^3 (post-context 10 for the r10 affinity) BEFORE this resize, so to get
      # an EXACT 2x on X,Y and a true no-op on Z, the resize target is 2*138=276 on
      # the two fine axes and 138 (native) on Z. Using [256,256,128] would zoom XY
      # only 1.855x AND downsample Z 138->128 then zero-pad it back (corrupting Z).
      resize: [276, 276, 138]
    label_transform:
      erosion: 2

model:
  input_size: [128, 128, 128]
