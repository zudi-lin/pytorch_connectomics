_base_:
- base_banis.yaml

experiment_name: nisb_base_banis_crop
description: >-
  STANDARD small-scale test = seed101 CENTER chunk (tile_1_1_1, origin
  [1000,1000,450], 1000x1000x450). Replaces the retired 384^3 crumb + 1024x1024x200
  "988" slab (too small -> wrong gradient; see lesson_standard_smallscale.md).
  Reports NERL via a LOCAL-skeleton ERLGraph built from the chunk GT
  (make_testcrop_skeleton.py). Center-chunk anchor: cc3d@0.66 NERL ~0.833, ceiling 0.90.

default:
  decoding:
    affinity_mask_path: ""
  evaluation:
    # NERL is the real objective; adapted_rand kept as a cheap secondary.
    # NOTE: on a crop adapted_rand and NERL can DISAGREE on ranking
    # (e.g. r3 vs r1e2: ARand picks r3, NERL picks r1e2) — trust NERL.
    metrics: [nerl, adapted_rand]

test:
  data:
    test:
      path: dev/nisb/data/center_chunk/
      image: img.h5
      label: seg.h5
      # Local-skeleton ERLGraph for chunk NERL (built by make_testcrop_skeleton.py;
      # 783 local CC skeletons, matches the tile_1_1_1 bench).
      skeleton: dev/nisb/data/center_chunk/seg.erlgraph.npz
      resolution: [9, 9, 20]

tune:
  data:
    val:
      path: dev/nisb/data/center_chunk/
      image: img.h5
      label: seg.h5
      resolution: [9, 9, 20]
  optimization:
    mode: single
    single_objective:
      metric: adapted_rand
      direction: minimize
  parameter_space:
    decoding:
      defaults:
        backend: numba
        edge_offset: 0
