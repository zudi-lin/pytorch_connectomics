_base_:
  - base_banis+.yaml

experiment_name: nisb_base_banis_plus_zebrafinch_heavy
description: >-
  From-scratch banis+ (MedNeXt-L/k3, 62M) on the 33 zebrafinch GT cubes with
  SNEMI/DeepEM-style heavy augmentation (`aug_em_neuron`: elastic + ±50%
  contrast + slice_shift/drop + lost_section + motion_blur + missing_parts +
  defect_mutex), trained 200k iterations from scratch (NO external init).

  Motivation: the prior ft-from-pretrained line (`base_banis+_zebrafinch_ft.yaml`,
  inherits the minimal flip+intensity aug) showed clear held-out regression vs
  the pretrained base on `test_50_skeletons` (per-chunk cc3d oracle ceiling
  0.752 -> 0.6024, see lesson L13). Two changes here: (1) heavy domain-matched
  aug instead of init-from-NISB, (2) anisotropic patch matching physical
  isotropy for 9x9x20 nm voxels.

  Patch [48,96,96] = ~864x864x960 nm physical (near-isotropic for 9x9x20 nm),
  vs the inherited 128^3 = ~1152x1152x2560 nm (Z-heavy + 5x more voxels).
  Smaller patch -> batch 8 (was 2) -> more random crops/step -> implicit
  regularization for 33-cube/62M-param regime. 48/16=3 satisfies MedNeXt-L's
  4-stage downsample. Heavy aug + batch 8 carry the regularization in place of
  arch shrinkage (we keep L per "banis+ model" definition; M would be the next
  lever if held-out NERL still underperforms).

  Data: same 33 padded cubes the ft uses (im_raw_4-32-32 + seg_gt_4-32-32 with
  -1 border). gt_*[0-9].h5 glob to avoid the L11/L12b skeleton-cache collision
  (the prior ft re-runs silently mis-paired against gt_*_skeleton.h5 siblings).

save_path: outputs/nisb_base_banis_plus_zebrafinch_heavy

default:
  system:
    num_gpus: 4
  data:
    dataloader:
      # Small zebrafinch GT cubes are h5 -> in-memory cache (base_banis profile
      # is `lazy` for NISB zarr). Explicit keys because profile payload can't
      # override an explicit value (see [[zebrafinch-ft-dynamics]] lessons).
      profile: cached
      use_lazy_zarr: false
      use_cache: false
      use_preloaded_cache_train: true
      use_preloaded_cache_val: true
      # 5x fewer voxels per patch vs 128^3 -> batch 8 fits where 2 was the
      # ceiling. 8 GPUs of effective batch = 8 with 4 GPUs * batch 2/GPU.
      batch_size: 8
      # Preflight requires model.input_size == data.dataloader.patch_size.
      patch_size: [48, 96, 96]
    augmentation:
      # DeepEM-matched: defect_mutex + elastic + ±50% contrast + slice
      # defects + motion blur + missing parts. The intent of this run.
      profile: aug_em_neuron
  model:
    # Smaller anisotropic patch matching physical isotropy for 9x9x20 nm.
    # MedNeXt-L stride checks: 48/16=3, 96/16=6 — all integer.
    input_size: [48, 96, 96]
    # No external_weights -> from-scratch (this is the explicit ablation vs
    # the init-from-NISB ft line).
    external_weights_path: null

train:
  optimization:
    optimizer:
      lr: 0.001          # from-scratch base banis+ peak (NOT the 1e-4 ft lr)
    max_steps: 200000
    scheduler:
      params:
        t_max: 200000
  data:
    train:
      path: ""
      resolution: [10, 10, 10]
      image: /projects/weilab/dataset/zebrafinch/train/im_raw_4-32-32/im_*[0-9].h5
      label: /projects/weilab/dataset/zebrafinch/train/seg_gt_4-32-32/gt_*[0-9].h5
    val:
      # Same 3-cube subset (also in train) the ft used — drives EMA-eval +
      # checkpoint selection. Real held-out eval is test_50_skeletons via
      # per-chunk cc3d + oracle (see lesson L13).
      path: ""
      resolution: [10, 10, 10]
      image:
        - /projects/weilab/dataset/zebrafinch/train/im_raw_4-32-32/im_z3456-3606_y3188-3338_x4043-4193.h5
        - /projects/weilab/dataset/zebrafinch/train/im_raw_4-32-32/im_z3914-4064_y9035-9185_x2573-2723.h5
        - /projects/weilab/dataset/zebrafinch/train/im_raw_4-32-32/im_z734-884_y9561-9711_x563-713.h5
      label:
        - /projects/weilab/dataset/zebrafinch/train/seg_gt_4-32-32/gt_z3456-3606_y3188-3338_x4043-4193.h5
        - /projects/weilab/dataset/zebrafinch/train/seg_gt_4-32-32/gt_z3914-4064_y9035-9185_x2573-2723.h5
        - /projects/weilab/dataset/zebrafinch/train/seg_gt_4-32-32/gt_z734-884_y9561-9711_x563-713.h5
