_base_:
  - base_banis+_r1e2.yaml

# Fair-budget re-run of r1e2. The original run (outputs/nisb_base_banis_plus_r1e2)
# used 2 GPUs x batch_size 2 = effective batch 4 -> 200k steps = 800k samples seen,
# i.e. only HALF the sample/effective-batch budget of the banis+ baseline (4 GPUs x
# batch 2 = eff batch 8 -> 1.6M samples). So its 0.571 NERL is a half-budget number,
# not a fair comparison to baseline 0.601. This config is identical in recipe; run it
# with --gres=gpu:4 so num_gpus:-1 sees 4 GPUs -> eff batch 8 -> matches the baseline
# exactly (dataset samples=40000/epoch, 200k steps = 1.6M samples, t_max 200k).
# Separate save_path so the 2-GPU run is preserved for the comparison.

experiment_name: nisb_base_banis_plus_r1e2_4gpu
save_path: outputs/nisb_base_banis_plus_r1e2_4gpu
