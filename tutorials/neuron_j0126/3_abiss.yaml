# j0126 step 2 of 3: affinity -> over-segmentation with ABISS.
#
#   python scripts/run_abiss_chunk.py --config tutorials/neuron_j0126/3_abiss.yaml --prepare-only
#   python scripts/run_abiss_chunk.py --config tutorials/neuron_j0126/3_abiss.yaml
#
# Input   outputs/neuron_j0126/affinity/   step 1's float16 affinity chunks
# Output  .../precomputed/seg              ABISS segmentation (CloudVolume precomputed)
#
# ABISS manages its own chunk hierarchy and chunked watershed/agglomeration, so this file
# is consumed by `scripts/run_abiss_chunk.py`, not by `scripts/main.py`.
#
# WHY THESE THRESHOLDS. The pipeline deliberately UNDER-agglomerates here and repairs the
# splits in step 3. In connectomics a split is cheap (a proofreader reconnects it) and a
# merge is expensive (it corrupts two neurons), and step 3's grow round is provably
# merge-safe -- it only ever assigns a fragment to a host, never welds two segments. So
# every ambiguous decision is better deferred to step 3 than taken here.
# AGG_THRESHOLD 0.20 with WS_HIGH 0.9 / WS_LOW 0.1 is the setting that reproduces the
# reference segmentation this tutorial was measured on.
#
# CPU scaling: ABISS uses every CPU granted to this process by the scheduler. Submit this
# as one shared-memory job (for example, Slurm `--cpus-per-task=64`), not a job array:
# hierarchy levels have strict barriers and all workers write the same output layers.

_base_: params.yaml

abiss_chunk:
  abiss_home: ${params.paths.repository}/lib/abiss
  workdir: ${params.paths.output_root}/abiss/run
  secrets_dir: ${params.paths.output_root}/abiss/secrets
  param_path: ${params.paths.output_root}/abiss/secrets/param

  # `source_affinity_h5` is deliberately UNSET: setting it copies the affinity
  # into a precomputed layer first (~3.7 TB, ~28 h), and ABISS then reads that
  # copy through CloudVolume -- the one backend that does NOT apply
  # AFF_KEEP_MASK, so the exclusion mask below would be loaded and silently
  # dropped. AFF_PATH points straight at the virtual dataset instead; no voxel
  # is copied and the h5 backend masks correctly. param.BBOX is then required,
  # since there is no source h5 to read the volume shape from.

  # On-disk precomputed storage chunks (NOT the ABISS logical chunk grid).
  seg_chunk_size_xyz: [512, 512, 80]
  # Mip-0 voxel size in nm, XYZ. The whole tutorial is 9 x 9 x 20 nm; a wrong
  # value here writes a layer whose scale the evaluator cannot find
  # (`ScaleUnavailableError: Scale <9,9,20> not found`).
  resolution_xyz: [9, 9, 20]

  # top_mip and root_tag are derived from BBOX / CHUNK_SIZE below; pinning them
  # here only creates a second place to get the chunk hierarchy wrong.
  overlap_mode: 0
  meta_dirs: []

  param:
    NAME: j0126_abiss

    AFF_PATH: ${params.data.affinity_h5}
    AFF_CHANNELS: [0, 1, 2]
    WS_PATH: file://${params.paths.output_root}/abiss/precomputed/ws
    SEG_PATH: file://${params.paths.output_root}/abiss/precomputed/seg
    SCRATCH_PATH: file://${params.paths.output_root}/abiss/scratch
    CHUNKMAP_OUTPUT: file://${params.paths.output_root}/abiss/chunkmap
    AFF_RESOLUTION: 0

    # Exclusion mask: FFN tissue AND the 0/255 border ring, built by the mask
    # step. This is the "ABISS, exclusion mask" row of the README's table; the
    # affinity is zeroed outside it before the watershed sees it.
    AFF_KEEP_MASK: ${params.data.keep_mask}

    # External nucleus identities. An empty NUC_PATH drops the whole NUC_* group
    # from the param file and disables competitive nucleus growth; ABISS gates on
    # KEY PRESENCE, so an empty-but-present NUC_PATH would make it open "" and
    # die. Set `params.data.nucleus_volume` to the published
    # `j0126-nucleus-instances-80nm.h5` to get the "+ nucleus instance
    # certificate" rows -- step 4 also requires it.
    # NUC_RATIO expands one source voxel to mip-0 tags, so ABISS_NUC_MIN_TAGGED
    # of 1024 is four source voxels -- enough that a resampling-edge speck cannot
    # become an identity.
    NUC_PATH: ${params.data.nucleus_volume}
    NUC_RATIO: ${params.data.nucleus_ratio}
    NUC_OFFSET: [0, 0, 0]
    NUC_MIN_SHARE: 0.02
    NUC_CONTACT_UM: 8.0
    NUC_COMPETITION_MARGIN_ZYX: [1024, 1024, 512]
    NUC_COMPETITION_FACTOR: 4
    ABISS_NUC_DOMINANCE: 0.6
    ABISS_NUC_MIN_TAGGED: 1024

    # Mip-0 XYZ. The true EM extent of the 10 nm volume is 5700 x 10913 x 10664 (ZYX);
    # in ABISS's XYZ order that is [0, 0, 0, 10664, 10913, 5700].
    BBOX: [0, 0, 0, 10664, 10913, 5700]

    # ABISS' logical chunk grid. Every layer-0 task holds one chunk of affinity
    # as float32, and `run_layer.sh` runs `parallel -j $ncpus` of them at once,
    # so this is the term that sets peak memory. The full-XY chunk this file
    # used to ship (10664 x 10913 x 80 = 9.3 Gvoxel) is 104 GiB per task and was
    # OOM-killed at 250 GB and again at 900 GB. [2048, 2048, 80] measures 7.8 GB
    # per chunk (~500 GB across 64 concurrent tasks) and leaves top_mip at 7, so
    # the merge depth is unchanged.
    #
    # NOTE: `chunk_volume.py` writes `<workdir>/<mip>_<x>_<y>_<z>.json` only when
    # it is absent, so a descriptor written by an earlier run OUTLIVES the
    # CHUNK_SIZE that produced it and changing this value is silently ignored.
    # Clear the workdir when you change it.
    CHUNK_SIZE: [2048, 2048, 80]

    # Conservative watershed: seeds only where affinity is unambiguous.
    WS_HIGH_THRESHOLD: 0.9
    WS_LOW_THRESHOLD: 0.1
    WS_SIZE_THRESHOLD: 400
    WS_DUST_THRESHOLD: 200

    # Mean-edge agglomeration threshold. Deliberately conservative -- see the header.
    AGG_THRESHOLD: 0.20

    PARANOID: false
    CHUNKED_AGG_OUTPUT: false

notes:
  - "Export the precomputed seg to h5/zarr for step 3, or point step 3's contact-graph builder at the precomputed volume directly."
  - "seg_chunk_size_xyz must align with every internal CHUNK_SIZE boundary on axes with multiple chunks; with CHUNK_SIZE z=80 the seg z chunk must be 80, not 64."
  - "Nothing in this step uses ground truth; the thresholds were chosen to under-agglomerate on principle, not fitted to the test skeletons."
