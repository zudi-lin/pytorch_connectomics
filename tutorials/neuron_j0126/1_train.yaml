# j0126 step 1, VARIANT: the SUPERVISED reference affinity.
#
#   train:  python scripts/main.py --config tutorials/neuron_j0126/1_train.yaml --mode train
#   infer:  python scripts/main.py --config tutorials/neuron_j0126/1_train.yaml --mode test \
#               --checkpoint <run>/checkpoints/step=00200000.ckpt
#
# ############################################################################
# THIS VARIANT IS NOT GROUND-TRUTH-FREE. It is not part of the 3-step pipeline.
# ############################################################################
# MedNeXt-L/k3 (62M) trained from scratch for 200k steps on the j0126 dense GT
# cubes. It has seen labelled j0126 tissue, so the README's headline claim --
# "no step uses ground truth" -- does NOT hold for any run that starts here.
# Use it as the SUPERVISED UPPER REFERENCE that says what the GT-free path is
# giving up. (The cubes come from a different alignment of the volume than the
# test skeletons, so this is target-domain supervision, not voxel-level test
# contamination.)
#
# DATA -- the PADDED cubes (`im_raw_4-32-32` / `seg_gt_4-32-32`), not the raw
# ones. The [4,32,32]-per-side pad is real EM context on the image side and -1
# on the label side, so the loss skips the border and no mask volume is needed.
# Paths are listed explicitly rather than globbed: a bare `gt_*.h5` also matches
# the `gt_*_skeleton.h5` siblings and would pair 66 labels against 33 images.
#
# SPLIT -- 25 train / 8 val, disjoint. Rule: sort the 33 cube names, take every
# 4th starting at index 2 for val. That holds out 8 cubes including 2 of the 4
# large 128x256x256 ones, so val is not systematically the small cubes.
#   The released checkpoint (`pytc/j0126 affinity_scratch_48x96x96.ckpt`) and
#   every number in the README results table PREDATE this split: that run
#   trained on all 33 cubes and validated on a 3-cube subset that was also in
#   train, so its val curve was not a generalization estimate. Retraining with
#   this config gives an honest held-out curve and a slightly different model;
#   it does not reproduce that checkpoint bit for bit.
#
# RESOLUTION -- 20 x 9 x 9 nm in ZYX (9 x 9 x 20 nm in XYZ), the native FFN
# mip-0 grid. The cubes, the inference volume and the evaluation skeletons all
# live on it. Nothing here is 10 nm isotropic despite the `im_align_10nm.zarr`
# name: that store is byte-for-byte equal to mip 0 on the same coordinates.
# Patch [48,96,96] is therefore 960 x 864 x 864 nm -- near-isotropic in physical
# space, which is the point of the anisotropic shape. MedNeXt-L is 4-stage /
# stride-16, and 48/16 = 3, 96/16 = 6, both integer.
#
# WINDOW -- infer at the trained [48,96,96]. MedNeXt normalizes with per-sample
# `GroupNorm(num_groups=C, num_channels=C)` and NO running statistics, so the
# forward pass depends on the window's spatial extent; the zero-shot
# [144,144,144] would invert the trained Z-thin anisotropy. Both window keys
# must live in YAML, never on the CLI: `inference.window` is copied into the
# runtime-owned `inference.sliding_window` alias, and the `default.inference`
# stage merge can clobber a pre-resolution CLI override. At the inherited
# `overlap: 0.5` the strides are (24,48,48) and 1008 % 24 == 1008 % 48 == 0, so
# every chunk's window lattice keeps the same phase and the seams stay
# reproducible. `sw_batch_size: 32` is ~17 GB; drop to 16 if it OOMs.
#
# Everything else -- input volume, 1008^3 grid, halo 72, reflect padding, ROI
# [5700,10913,10664], select_channel [0,1,2], scale_sigmoid, float16 -- is
# inherited from `2_infer.yaml` unchanged, so these chunks are
# directly comparable in layout with the zero-shot ones.

_base_:
  - 2_infer.yaml

experiment_name: neuron_j0126_affinity_arm0_96
description: >-
  Supervised reference affinity for j0126: from-scratch MedNeXt-L/k3 trained 200k steps on
  the j0126 dense GT cubes (25 train / 8 held-out val), inferred at its native [48,96,96]
  window. NOT ground-truth-free -- the upper reference against 2_infer.yaml,
  not a drop-in for it.

save_path: ${params.paths.output_root}/affinity_arm0_96

default:
  system:
    num_gpus: 4
  model:
    input_size: [48, 96, 96]
    # From scratch. This is the explicit ablation against the init-from-NISB
    # finetune line, so do NOT set an external_weights_path here.
    external_weights_path: null
  data:
    dataloader:
      # The GT cubes are small h5 volumes, so cache them in memory; banis.yaml's
      # `lazy` profile targets the big NISB zarr. Keys are explicit because a
      # profile payload cannot override an explicit value.
      profile: cached
      use_lazy_zarr: false
      use_cache: false
      use_preloaded_cache_train: true
      use_preloaded_cache_val: true
      # 5x fewer voxels per patch than 128^3, so batch 8 fits where 2 was the
      # ceiling -- more random crops per step, which regularizes a 62M-param
      # model on 25 cubes.
      batch_size: 8
      # Preflight requires model.input_size == data.dataloader.patch_size.
      patch_size: [48, 96, 96]
    augmentation:
      # DeepEM-matched heavy augmentation: defect_mutex + elastic + ±50% contrast
      # + slice shift/drop + lost_section + motion blur + missing parts. With so
      # few cubes this carries the regularization instead of shrinking the model.
      profile: aug_em_neuron
  inference:
    window:
      window_size: [48, 96, 96]
      sw_batch_size: 32
  decoding:
    # Chunked raw prediction naming still uses the decode suffix even though
    # decoding is disabled in step 1. Without this override the native-window
    # run targets the complete 144-window store and silently skips on exists.
    save_suffix: zebrafinch_chunk_raw_grid1008_halo72_win48x96x96

train:
  optimization:
    optimizer:
      # From-scratch banis+ peak LR, not the 1e-4 a finetune would use.
      lr: 0.001
    max_steps: 200000
    scheduler:
      params:
        t_max: 200000
  data:
    train:
      # The 25 training cubes: sorted cube names minus every 4th from index 2.
