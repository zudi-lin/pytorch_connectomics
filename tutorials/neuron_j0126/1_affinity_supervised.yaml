# j0126 step 1, VARIANT: affinity from the SUPERVISED from-scratch model.
#
#   python scripts/main.py --config tutorials/neuron_j0126/1_affinity_supervised.yaml --mode test \
#       --checkpoint outputs/nisb_base_banis_plus_zebrafinch_heavy/20260726_114349/checkpoints/step=00200000.ckpt
#
# ############################################################################
# THIS VARIANT IS NOT GROUND-TRUTH-FREE. It is not part of the 3-step pipeline.
# ############################################################################
#
# The checkpoint is MedNeXt-L/k3 (62M) trained from scratch for 200k steps ON THE 33
# ZEBRAFINCH DENSE GT CUBES (`tutorials/neuron_nisb/base_banis+_zebrafinch_heavy.yaml`,
# heavy `aug_em_neuron`). Those cubes are j0126 ground truth, so this model has seen
# labelled j0126 tissue and the README's headline claim -- "no step uses ground truth" --
# does NOT hold for any run that starts here. Use it as the SUPERVISED UPPER REFERENCE
# that tells you what the GT-free path is giving up, not as a drop-in for `1_affinity_zeroshot.yaml`.
#
# (The 33 cubes come from a different alignment of the volume than the test skeletons, so
# this is not voxel-level test contamination. It is still supervision on the target domain.)
#
# The native-window full-volume affinity/decode is being produced separately. The prior
# whole-volume score 0.444376 came from this checkpoint inferred at [144,144,144]: its
# affinity path has the default suffix and is `arm0_win144`, not this config. Do not attach
# that number or its 0.941244 union-only oracle to the native-window artifact.
#
# Output: the checkpoint-derived test directory, with one float16 CZYX HDF5 per chunk under
# a store whose name ends `_win48x96x96.h5.chunks`.
#
# ---------------------------------------------------------------------------
# WHY THE WINDOW CHANGES, AND WHY IT MUST
#
# This model was trained at patch [48,96,96] (anisotropic -- near-isotropic in nm for
# 9x9x20 voxels), NOT at the 128^3 the pretrain model used. MedNeXt normalizes with
# `nn.GroupNorm(num_groups=C, num_channels=C)`, i.e. per-sample per-channel InstanceNorm
# with NO running statistics
# (lib/MedNeXt/nnunet_mednext/network_architecture/mednextv1/blocks.py:42). Normalization
# statistics are therefore computed over the *window's* spatial extent at every block, so
# THE FORWARD PASS IS WINDOW-SIZE DEPENDENT. Running this checkpoint at the inherited
# [144,144,144] would be a 3x Z / 1.5x XY extent mismatch and would invert the trained
# Z-thin anisotropy. Native-window affinities ranked better on the fixed local chunks; a
# whole-volume funlib/mt50 value must wait for the native store and decode to finish.
#
# Divisibility, which the [48,96,96] choice has to satisfy on two counts:
#   * MedNeXt-L is 4-stage / stride-16: 48/16 = 3 and 96/16 = 6.
#   * At the inherited `overlap: 0.5` the strides are (24,48,48); 1008 % 24 == 0 and
#     1008 % 48 == 0, so every chunk's window lattice has the same phase and chunk seams
#     stay reproducible. (This is the invariant the "1008 = 14 * 72" comment in
#     base_banis+_zebrafinch.yaml protects for the 144 window.)
# Total voxel-forwards per chunk land within 10% of the [144,144,144] run (24,863 small
# windows vs 3,375 large), so wall-clock is comparable despite the 7.4x window count.
#
# sw_batch_size 32: the pretrain model measures ~3.46 GB per batch unit at 144^3 (+0.77 GB
# fixed). A [48,96,96] window is 6.75x fewer voxels => ~0.51 GB/unit => 32 units ~= 17 GB,
# which fits both the 40 GB A100 (g003-g006) and the 49 GB L40S (g010-g018). Drop to 16 if
# it OOMs.
#
# BOTH window keys MUST live in YAML, never on the CLI: `inference.window` is copied into
# the runtime-owned `inference.sliding_window` alias (which the lazy/zarr path actually
# reads) by `sync_inference_runtime_aliases`, and the `default.inference` stage merge can
# clobber a pre-resolution CLI override. Original diagnosis in
# base_banis+_zebrafinch_zarr_b4.yaml; the same class of bug silently reverted an ROI
# override via runtime/sharding.py:57.
#
# Everything else -- input zarr, 1008^3 grid, halo 72, reflect padding, roi
# [5700,10913,10664], select_channel [0,1,2], scale_sigmoid, float16 -- is inherited
# unchanged, so these chunks are directly comparable in layout with `1_affinity_zeroshot.yaml`'s.

_base_:
  - 1_affinity_zeroshot.yaml

experiment_name: neuron_j0126_affinity_arm0_96
description: >-
  Supervised reference affinity for j0126: from-scratch MedNeXt-L/k3 trained 200k steps on
  the 33 zebrafinch dense GT cubes, inferred at its native [48,96,96] window. NOT
  ground-truth-free -- provided as the upper reference against the zero-shot
  1_affinity_zeroshot.yaml, not as part of the GT-free pipeline.

save_path: outputs/neuron_j0126/affinity_arm0_96

default:
  inference:
    window:
      window_size: [48, 96, 96]
      sw_batch_size: 32
  decoding:
    # Chunked raw prediction naming still uses the decode suffix even though
    # decoding is disabled in step 1. Without this override the native-window
    # run targets the complete 144-window store and silently skip-on-exists.
    save_suffix: zebrafinch_chunk_raw_grid1008_halo72_win48x96x96
