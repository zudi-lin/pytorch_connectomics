_base_:
  # Local copies, so this tutorial does not depend on experiment configs that come
  # and go elsewhere in the tree. base_banis+_zebrafinch_zarr.yaml supplies the
  # window/chunking geometry and reads the random-access zarr; do NOT swap it for
  # the tiled-PNG variant, which re-decodes 4096x4096 tiles per window and runs
  # ~19 h/chunk with the GPU idle (vs ~30 min/chunk).
  - base_banis+_zebrafinch_zarr.yaml

experiment_name: neuron_j0126_affinity
description: >-
  Stage 1 of the j0126 (zebra finch) ABISS tutorial: EM image -> 3-channel
  affinity, written STRAIGHT INTO a CloudVolume precomputed layer.

  Three things make this reproducible end-to-end without a conversion step:

  1. `chunking.precomputed` writes each inference chunk directly into the output
     layer instead of per-chunk HDF5 + a stitch pass. ABISS reads `AFF_PATH`
     through CloudVolume, so its input *is* this layer -- no separate "mirror the
     h5 chunks into precomputed" step (3.1 TB of duplicate affinity here).

  2. `chunking.precomputed_affinity_convention: abiss` emits the affinity in the
     layout ABISS reads (edge v -> v-1, channels [z,y,x] -> [x,y,z]) instead of
     the model's native one. See README.md -- both are silent when wrong.

  3. `chunking.roi`, inherited from the base, clips the chunk grid to the true EM
     extent: the source zarr is rounded out to 5700 x 12288 x 12288, so this is
     worth 1014 -> 726 chunks.

save_path: outputs/neuron_j0126_affinity

default:
  inference:
    model:
      # Short-range affinities only (axis 0/1/2), as plain sigmoid(x). The base
      # emits `scale_sigmoid` = sigmoid(0.2*x) (BANIS' temperature), which ABISS
      # would then need undone by a logit/0.2 restore pass; emitting sigmoid(x)
      # here produces the value ABISS consumes directly.
      select_channel: [0, 1, 2]
      output_dtype: float32
      channel_activations:
        - {channels: ":", activation: sigmoid}
    chunking:
      # Write chunks straight into the precomputed layer (no h5, no stitching).
      precomputed: true
      # XYZ nm. Must match the mip `AFF_RESOLUTION` selects in abiss.yaml.
      precomputed_resolution: [9, 9, 20]
      # XYZ storage chunk; divides the inherited 1008^3 inference chunk on every
      # axis (1008 = 7*144 = 14*72) so concurrent chunk writes never straddle one.
      precomputed_chunk_size: [144, 144, 72]
      # Emit ABISS' affinity convention rather than the model's native one.
      precomputed_affinity_convention: abiss
    save_results: true
    save_dtype: float32
