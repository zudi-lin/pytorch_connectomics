_base_:
  # Local copies, so this tutorial does not depend on experiment configs that come
  # and go elsewhere in the tree. base_banis+_zebrafinch_zarr.yaml supplies the
  # window/chunking geometry and reads the random-access zarr; do NOT swap it for
  # the tiled-PNG variant, which re-decodes 4096x4096 tiles per window and runs
  # ~19 h/chunk with the GPU idle (vs ~30 min/chunk).
  - base_banis+_zebrafinch_zarr.yaml

experiment_name: neuron_j0126_affinity
description: >-
  Stage 1 of the j0126 (zebra finch) ABISS tutorial: EM image -> 3-channel
  affinity, saved as float16 HDF5 for ABISS to read directly.

  Output is float16 HDF5, the same artifact this pipeline has always written.
  ABISS reads it directly through its HDF5 backend, so there is no conversion step
  and no second copy of the volume.

  `chunking.roi`, inherited from the base, clips the chunk grid to the true EM
  extent: the source zarr is rounded out to 5700 x 12288 x 12288, so this is worth
  1014 -> 726 chunks of wasted prediction on pure padding.

save_path: outputs/neuron_j0126_affinity

default:
  inference:
    model:
      # Short-range affinities only (axis 0/1/2), as plain sigmoid(x). The base
      # emits `scale_sigmoid` = sigmoid(0.2*x) (BANIS' temperature), which ABISS
      # would then need undone by a logit/0.2 restore pass; emitting sigmoid(x)
      # here produces the value ABISS consumes directly.
      select_channel: [0, 1, 2]
      output_dtype: float32
      channel_activations:
        - {channels: ":", activation: sigmoid}
    save_results: true
    save_backend: h5
    # float16 halves the affinity on disk versus float32. A precomputed layer would
    # force float32 (~2x), which for this volume is the difference between ~1.5 TB
    # and ~3.1 TB; ABISS reads the HDF5 directly, so there is no reason to pay it.
    save_dtype: float16

  # Stage 1 produces affinity only -- ABISS does the segmentation in stage 2.
  # Leaving decoding on makes the test pipeline read the stitched whole-volume
  # prediction back in one piece (np.array over the full h5), which for j0126 is a
  # 9.4 TiB allocation and dies.
  decoding:
    enabled: false
