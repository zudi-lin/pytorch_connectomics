# j0126 step 3: prediction-only skeleton-based error detection and correction.
#
# This is the frozen v7 method used by the paper result. It examines every sufficiently
# confident contact between long predicted branches; it does not select neurons, boxes, or
# proposals from evaluation skeletons. The nucleus manifest is an external identity firewall.
#
# Print the complete execution plan without touching data:
#   python scripts/run_error_correction.py \
#       --config tutorials/neuron_j0126/3_merge.yaml --stage all --num-tasks 1 --dry-run
#
# Whole-volume execution is staged because skeleton/contact/postprocess passes are arrays.
# See README.md for the exact commands.

_base_: params.yaml

error_correction:
  version: 1

  # Frozen native-resolution, nucleus-matchguard ABISS base used by the v7 experiment.
  # Replace these five input paths together when applying the method to another decode.
  segmentation: ${params.paths.experiment_root}/wholevol_arm0_native96_nuc_matchguard/seg_arm0_native96_nuc_matchguard/precomputed/seg/seg_arm0_native96_nuc_matchguard
  affinity_chunks: ${params.paths.repository}/outputs/nisb_base_banis_plus_zebrafinch_heavy/20260726_114349/test_step=00200000/0/raw_x1_ch0-1-2_chunked-raw_cs1008x1008x1008_halo72x72x72_zebrafinch_chunk_raw_grid1008_halo72_win48x96x96.h5.chunks
  keep_mask: ${params.paths.experiment_root}/tissue_border_keep_mask_full.zarr
  nucleus_manifest: ${params.paths.experiment_root}/wholevol_arm0_native96_nuc_matchguard/seg_arm0_native96_nuc_matchguard/nucleus_competition/manifest.json
  # ABISS emits one (label,size) table per atomic chunk. The reference workspace already
  # contains their exact aggregate; a fresh run can point this glob at all atomic tables.
  size_glob: ${params.paths.experiment_root}/matchguard_contacts_full/seg_size_all_chunks.data

  workdir: ${params.paths.output_root}/error_correction_v7
  output_segmentation: ${params.paths.output_root}/error_correction_v7/precomputed/seg

  # Native j0126 frame: arrays are ZYX, CloudVolume and chunk cores are XYZ.
  volume_shape_zyx: [5700, 10912, 10664]
  affinity_chunk_size: 1008
  restore_sigmoid_scale: 0.2
  contact_z_slab: 8
  core_xyz: [512, 512, 256]
  halo_xyz: [32, 32, 16]
  downsample_zyx: [1, 2, 2]
  expected_chunks: 10626
  expected_size_files: null
  task_count: 80

  # Full RAG keeps every ABISS segment (200-voxel dust floor). Skeletonization starts at
  # 100k voxels, the prediction-only definition of a branch worth reconnecting.
  min_contact_voxels: 200
  min_skeleton_voxels: 100000
  skeleton_parallel: 8
  skeleton_spacing_nm: 250
  junction_workers: 8

  # Kisuk-style inter-object cleanup, applied AFTER v7 unions. [0,0,0] reproduces v7
  # without cosmetic thinning; [1,1,1] is the reported 3x3x3 result.
  erosion_radius_zyx: [1, 1, 1]

  # Frozen engineering constants. Lengths are physical nm and the affinity floors come
  # from unlabeled contact-distribution quantiles, not evaluation skeletons.
  parameters:
    morphology:
      max_port_distance_nm: 10000
      prune_nm: 2000
      tangent_nm: 3000
      twig_nm: 3000
      branch_profile_nm: 10000
      spine_radius_ratio: 0.5
      spine_parent_collinearity: 0.5
      spine_parent_radius_balance: 0.5
      spine_perpendicularity: 0.5

    candidates:
      min_segment_length_nm: 10000

    # Exhaustive scope: all 20,857 reference contacts with affinity_ge08_fraction >= 0.05.
    junction:
      min_affinity: 0.05

    # Tier 1: direct continuation. Tier 2: unique physical-interior branch -> long host.
    resolve_v2:
      scope_min_affinity_ge08_fraction: 0.05
      min_affinity_mean: 0.70
      min_affinity_ge09_fraction: 0.50
      max_junction_gap_nm: 750
      max_leaf_distance_nm: 1500
      min_turn_short_deg: 97.36936936936937
      min_radius_ratio: 0.45
      local_competition_nm: 2000
      max_component_segments: 8
      min_internal_source_length_nm: 30000
      min_internal_host_length_nm: 100000
      min_internal_host_ratio: 4
      min_internal_affinity_mean: 0.30
      min_internal_affinity_ge08_fraction: 0.20
      min_internal_affinity_ge09_fraction: 0.20

    # Tier 3: two-host connector, accepted atomically.
    resolve_v3:
      max_junction_gap_nm: 750
      max_leaf_distance_nm: 1500
      min_turn_short_deg: 97.36936936936937
      min_radius_ratio: 0.45
      min_connector_length_nm: 10000
      max_connector_length_nm: 100000
      min_connector_host_length_nm: 50000
      min_connector_host_ratio: 2
      min_connector_affinity_mean: 0.25
      min_connector_affinity_ge08_fraction: 0.15
      min_connector_affinity_ge09_fraction: 0.10
      min_connector_end_separation_nm: 5000
      min_connector_end_separation_ratio: 0.20
      max_component_segments: 8

    # Tier 4: smaller unique physical-interior branch -> one host.
    resolve_v4:
      max_junction_gap_nm: 750
      max_leaf_distance_nm: 1500
      min_turn_short_deg: 97.36936936936937
      min_radius_ratio: 0.45
      min_internal_source_length_nm: 10000
      max_internal_source_length_nm: 100000
      min_internal_host_length_nm: 50000
      min_internal_host_ratio: 2
      min_internal_affinity_mean: 0.30
      min_internal_affinity_ge08_fraction: 0.20
      min_internal_affinity_ge09_fraction: 0.20
      max_component_segments: 8

    # Tier 5: unique terminating branch -> one nucleus-bearing host.
    resolve_v5:
      max_junction_gap_nm: 750
      max_leaf_distance_nm: 1500
      min_turn_short_deg: 97.36936936936937
      min_radius_ratio: 0.45
      min_source_length_nm: 10000
      min_nucleus_host_length_nm: 100000
      min_affinity_mean: 0.30
      min_affinity_ge08_fraction: 0.20
      min_affinity_ge09_fraction: 0.20
      max_component_segments: 12

    # Tier 7: stable multiscale continuation between two long branches.
    resolve_v7:
      max_junction_gap_nm: 750
      max_leaf_distance_nm: 1500
      min_multiscale_turn_deg: 110
      min_radius_ratio: 0.45
      min_segment_length_nm: 100000
      min_affinity_mean: 0.40
      min_affinity_ge09_fraction: 0.10
      local_competition_nm: 2000
      max_component_segments: 12
