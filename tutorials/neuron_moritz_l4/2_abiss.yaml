# Moritz L4 step 2 of 3: whole-volume affinity -> over-segmentation with ABISS,
# masked to NOT(blood vessel) AND tissue, with competitive nucleus growth.
#
#   python scripts/run_abiss_chunk.py --config tutorials/neuron_moritz_l4/2_abiss.yaml --prepare-only
#   python scripts/run_abiss_chunk.py --config tutorials/neuron_moritz_l4/2_abiss.yaml
#
# Input   the whole-volume affinity precomputed layer written by the inference pass
# Output  .../precomputed/seg   ABISS segmentation (CloudVolume precomputed)
#
# NO AFFINITY COPY. `source_affinity_h5` is deliberately omitted: the inference pass
# already wrote a precomputed layer *in the ABISS convention* (edge shift v->v-1 and
# channel order [x,y,z]) -- measured, not assumed, see FRAME.md. AFF_PATH is therefore
# used as-is, which avoids a 645 GB copy and makes `param.BBOX` required.
#
# FRAME. Every coordinate here is in the VOLUME frame, whose origin is global
# (118, 0, 0) zyx. The 96 GT skeletons are in the GLOBAL frame, so evaluation must add
# 118 to z. Getting this wrong yields a plausible segmentation that scores ~0.
#
# CPU scaling: ABISS uses every CPU the scheduler grants this process. Submit as ONE
# shared-memory job (`--cpus-per-task=64`), not a job array: hierarchy levels have
# strict barriers and all workers write the same output layers.

_base_: params.yaml

abiss_chunk:
  abiss_home: ${params.paths.repository}/lib/abiss
  workdir: ${params.paths.output_root}/abiss/run
  secrets_dir: ${params.paths.output_root}/abiss/secrets
  param_path: ${params.paths.output_root}/abiss/secrets/param

  # On-disk precomputed storage chunks (NOT the ABISS logical chunk grid).
  # aff must match the affinity layer's own chunk_sizes ([128,128,48] from its info);
  # seg z must equal CHUNK_SIZE z (80), per the j0126 alignment rule.
  copy_block_shape_xyz: [128, 128, 48]
  aff_chunk_size_xyz: [128, 128, 48]
  seg_chunk_size_xyz: [128, 128, 32]
  resolution_xyz: [11, 11, 28]        # ints only (_maybe_int_list); display metadata

  # _compute_top_mip([0,0,0,5599,8534,3306], [2816,2944,32]) == 7  (checked, not guessed;
  # the 2 x 3 x 104 grid halves to 1x1x1 in the same 7 steps the old 1 x 1 x 104 did)
  root_tag: "7_0_0_0"
  top_mip: 7
  overlap_mode: 0
  meta_dirs: []

  param:
    NAME: moritz_l4_abiss

    AFF_PATH: file://${params.data.affinity_precomputed}
    WS_PATH: file://${params.paths.output_root}/abiss/precomputed/ws
    SEG_PATH: file://${params.paths.output_root}/abiss/precomputed/seg
    SCRATCH_PATH: file://${params.paths.output_root}/abiss/scratch
    CHUNKMAP_OUTPUT: file://${params.paths.output_root}/abiss/chunkmap
    AFF_RESOLUTION: 0

    # --- exclusion mask (j0126 step 3's "ABISS, exclusion mask" row) -------------
    # keep = NOT(blood vessel) AND tissue; affinity is zeroed outside it BEFORE the
    # watershed sees it, so nothing can grow through vessel lumen or the zero-padding
    # border and chain two neurons. 5.05% of the volume dropped.
    #
    # AFF_KEEP_MASK_RATIO is what makes this affordable: the mask stays on the
    # 4x8x8 grid it was predicted on (5 MB) and the backend upsamples per read. It is
    # honoured for a PRECOMPUTED AFF_PATH only since the keep-mask fix in
    # lib/abiss/scripts/volume_backends.py -- before that, a precomputed affinity was
    # silently read unmasked no matter what this key said.
    AFF_KEEP_MASK: ${params.data.keep_mask}
    AFF_KEEP_MASK_RATIO: ${params.data.mask_ratio}

    # --- nucleus instance certificate (j0126's "+ nucleus certificate" rows) -----
    # Setting NUC_PATH inserts the competitive_nucleus_growth stage between the
    # watershed remap and agglomeration: watershed objects holding two nucleus
    # identities are split between them, and the manifest under
    # <workdir>/nucleus_competition/manifest.json is the firewall a later error
    # correction pass reads (it never joins two different identities).
    #
    # 101 predicted instances, no GT. Whether the certificate has anything to correct
    # is a property of the WATERSHED, not of the nucleus mask -- on a zero-shot
    # affinity j0126's scan found 0 multi-nucleus objects and the row was inert.
    NUC_PATH: ${params.data.nuclei}
    NUC_RATIO: ${params.data.mask_ratio}
    NUC_OFFSET: [0, 0, 0]
    # mip-0 voxel, ZYX nm. Distances below are physical, so they transfer from j0126
    # unchanged; the voxel-count margin j0126 pins (NUC_COMPETITION_MARGIN_ZYX) does
    # not, because these voxels are 28 x 11.24 x 11.24 nm and j0126's are 20 x 9 x 9.
    NUC_VOXEL_SIZE_ZYX_NM: [28.0, 11.24, 11.24]
    NUC_MIN_SHARE: 0.02
    NUC_CONTACT_UM: 8.0
    NUC_COMPETITION_MARGIN_UM: 5.0
    NUC_COMPETITION_FACTOR: 4
    ABISS_NUC_DOMINANCE: 0.6
    # 1024 mip-0 tags == 4 source voxels at ratio [4, 8, 8], so a resampling-edge
    # speck cannot become an identity.
    ABISS_NUC_MIN_TAGGED: 1024

    # Volume frame, XYZ. Tissue is a subset of this; the layer keeps the y<103 / x<103
    # zero padding and is cropped only on the far face.
    BBOX: [0, 0, 0, 5599, 8534, 3306]

    # SIZED TO FIT IN RAM, not to minimise stitching. 2 x 3 x 104 = 624 chunks.
    #
    # Z IS 32 BECAUSE OF A HARD 32-BIT CAP. ABISS's watershed uses
    # `internal_seg_t = uint32_t` and asserts
    #   atomic_chunk.cpp:135  chunk_size < watershed_traits<uint32_t>::high_bit
    # so a PADDED atomic chunk (core+1 on every side) must be < 2^31 = 2.147e9 voxels.
    # z=80 -> 3.92e9 = 183% of the cap (job 2954910 died on the assertion); z=32 is the
    # value that survives at full XY.
    #
    # XY WAS [5599, 8534] UNTIL 2026-09-09, i.e. one chunk covering the whole face,
    # following j0126's "large in XY to minimise cross-face stitching". At this volume's
    # size that rule is a trap. A [5599, 8534, 32] chunk pads to 1.63e9 voxels = 76% of
    # the cap, and its `aff.raw` -- which the C++ binaries mmap as float32 -- is 19.5 GB.
    # Thirty-two of those run at once (ABISS's concurrency IS the cpu count), so the
    # working set is 624 GB against a 500 GB allocation. It thrashes:
    #
    #   per-chunk wall time, WS_HIGH 0.5 -> 0.95   whole volume (1.53 Gvox chunks): 28 min -> 4.1 h  (8.8x)
    #                                       pre-flight box (33 Mvox chunks):  7:05 -> 13:17  (1.9x)
    #
    # Same thresholds, same voxels per unit volume; the only difference is whether a
    # chunk's working set fits in memory. Job 2982513 spent 12 h on 59 of 104 chunks.
    #
    # [2816, 2944, 32] pads to 2.82e8 = 13.1% of the cap and a 3.39 GB `aff.raw`, so 64
    # slots need ~173 GB and fit the 113 nodes in `medium`/`long` that have 64 cores and
    # 257 GB. Both are multiples of 128, which the seg chunk size requires on any axis
    # with more than one chunk (see seg_chunk_size_xyz). More cross-face stitching is the
    # price; ABISS is built for it, and 12 hours of thrashing is not.
    #
    # _compute_top_mip([0,0,0,5599,8534,3306], [2816,2944,32]) == 7  (checked, not guessed)
    CHUNK_SIZE: [2816, 2944, 32]

    # WATERSHED args -- argv[3..6] of the `ws` binary, and THE parameter that decides
    # whether this volume segments at all. WS_HIGH was 0.5 until 2026-09-08.
    #
    # 0.5 was validly fitted GT-free on the 26 held-out val cubes (decision D2; the 96
    # test skeletons were never used): 0.0726 mean VOI vs decode_affinity_cc's 0.2201,
    # better on 26/26 cubes, n_pred 55.3 vs n_gt 45.1, and bracketed (0.45 -> 0.0730,
    # 0.50 -> 0.0726, 0.55 -> 0.0744). Every one of those numbers is still true. It does
    # not transfer, and the failure is invisible at cube scale:
    #
    #   WS_HIGH 0.5 makes ONE watershed object own 70.7% of a 1024x1024x32 chunk, with
    #   588 other objects around it. The whole-volume `ws` layer still looks healthy
    #   (largest label 1.94%) ONLY because each chunk's giant carries a different id;
    #   agglomeration then stitches them across faces into the segment that owned 67.5%
    #   of the finished volume. On a 100^3 cube a basin has no room to flood, so the VOI
    #   fit never saw it.
    #
    # Nothing downstream can undo it: AGG_THRESHOLD is INERT here -- 0.80, 0.95, 0.98,
    # 1.5 and 1e6 give byte-identical segmentations -- and the blood-vessel/border keep
    # mask, which removes real high-affinity bridges, does not move the number either.
    #
    # Swept GT-free on the pre-flight box (2_abiss_smoke.yaml), largest segment as a
    # share of foreground / background fraction:
    #   0.50 / 0.00  78.59%  12.42%   <- the fitted pair
    #   0.90 / 0.10  31.25%  15.82%   <- j0126's
    #   0.95 / 0.30  11.39%  29.57%
    #   0.95 / 0.10   8.73%  15.82%
    #   0.95 / 0.05   8.12%  12.55%
    #   0.95 / 0.00   8.37%  12.42%   <- chosen: one parameter changed, and background
    #   0.99 / 0.05   8.23%  12.55%      stays at the keep mask's own floor
    # WS_HIGH >= 0.95 plateaus at ~8%; WS_LOW only trades background for a slightly
    # smaller giant, so it stays at 0.0 and the change is a single number.
    #
    # So j0126's WS_HIGH 0.9 was directionally RIGHT and this file previously said the
    # opposite. The reasoning that led to 0.5 -- interior mode ~0.89, so 0.9 starves the
    # watershed -- describes what happens inside one cube, not what a basin does when it
    # is given 1024 voxels of room to flood through a membrane whose affinity is 0.88.
    WS_HIGH_THRESHOLD: 0.95
    WS_LOW_THRESHOLD: 0.0
    # Absorb dust into its neighbour rather than carrying it through the region graph.
    # WS_HIGH 0.95 makes ~12x more supervoxels than 0.5 did, and most of the new ones are
    # specks. Measured on the pre-flight box (WS_HIGH 0.95 / WS_LOW 0.0), largest segment
    # as a share of foreground / watershed labels / background:
    #    400 /  200   8.37%  18691  12.4208%   <- the coarse-fit values
    #   1000 /  500   7.99%   8068  12.4233%   <- chosen
    #   2500 / 1250   7.20%   4920  12.4233%
    # Fewer supervoxels and a slightly BETTER guard, with background unchanged -- the
    # dust is merged, not discarded. 1000 voxels is 0.0035 um^3 here; 2500 is 0.0088,
    # which is the volume of a 100 nm neurite 1 um long, so it stops at 1000.
    # NOTE this did NOT buy runtime on the pre-flight box (12:56 vs 13:17), so it is not
    # the answer to the cost problem -- CHUNK_SIZE is. It is taken for the region graph.
    WS_SIZE_THRESHOLD: 1000
    WS_DUST_THRESHOLD: 500

    # AGG_THRESHOLD IS **NOT** FITTED, AND MUST NOT BE TAKEN FROM THE VAL-CUBE SWEEP.
    #
    # A first whole-volume run used 0.001 here, taken from that sweep, and PERCOLATED:
    # one segment held 96.63% of all GT skeleton nodes, base NERL 0.0007, voi_merge
    # 5.8778 (job 2958127 decode, scored by job 2959751). The merge oracle on the same
    # output was 0.9158, i.e. the fragments were excellent and the agglomeration fused
    # them.
    #
    # The cause was a parameter conflation, not scale. The two paths do DIFFERENT things:
    #   single-volume `ws` binary: merge_segments(..., pair(size_threshold, merge_thr), dust)
    #       -> SIZE-GATED, only absorbs fragments under WS_SIZE_THRESHOLD (400 voxels).
    #          This is what the val-cube sweep varied, which is why it looked "inert"
    #          across 0.0002..0.01 -- it only ever touched sub-400-voxel dust.
    #   chunked path: `agg $AGG_THRESHOLD input_rg.data` (atomic_chunk_me.sh:43)
    #       -> UNRESTRICTED mean-edge agglomeration on the region graph. With this
    #          affinity's background mode at ~0.05, a 0.001 threshold merges everything.
    #
    # 0.20 is j0126's value, which produced their reference segmentation and was never
    # invalidated by anything measured here. Treat it as a starting point: it has NOT
    # been fitted on this volume. Fit it GT-free via the largest-segment volume
    # fraction (a percolated segment is absurdly large, no GT needed), not by VOI on
    # 100^3 cubes, which cannot see percolation at all.
    AGG_THRESHOLD: 0.80

    # --- agglomeration SIZE HEURISTIC -------------------------------------------
    # THIS, not AGG_THRESHOLD, is what percolated the volume. `agg` force-merges any
    # edge at affinity >= size_params.aff_threshold when a segment is under
    # small_voxel_threshold, INDEPENDENT of AGG_THRESHOLD and of the 0.9-down-by-0.1
    # schedule. Vendored defaults (mean_aggl.cpp:121) are
    #     aff_threshold 0.35 / small 1e6 voxels / large 1e7 voxels
    # and at 11.24 x 11.24 x 28 nm, 1e6 voxels is ~3546 um^3 -- i.e. essentially every
    # neurite in this volume counts as "small" and gets chained at aff >= 0.35.
    #
    # Evidence it is the culprit, not AGG_THRESHOLD: the guard's largest-label share is
    # flat at 67.05% / 68.35% / 66.38% for AGG_THRESHOLD 0.001 / 0.20 / 0.35 (three
    # orders of magnitude) while the `ws` layer is healthy at 1.74%. Label counts DO
    # respond (1056 -> 3882), so the threshold prunes weak edges but never touches the
    # high-affinity chains the size heuristic creates.
    #
    # These are env-settable (set_env.py exports them; the binary falls back to its
    # literals when absent, so omitting them reproduces the old behaviour exactly).
    # Absorb only genuine dust, and require real confidence to do it.
    AGG_SIZE_AFF_THRESHOLD: 0.35
    AGG_SMALL_VOXEL_THRESHOLD: 1000000
    AGG_LARGE_VOXEL_THRESHOLD: 10000000

    PARANOID: false
    CHUNKED_AGG_OUTPUT: false

notes:
  - "Thresholds are fitted on val cubes (VOI, local) and transferred to the whole volume (NERL, long-range). If the S3 oracle ceiling is high but the base NERL is low, suspect this transfer before suspecting the affinity."
  - "WS_LOW 0.0 means no affinity edge is declared a hard boundary a priori. On 100^3 cubes percolation cannot manifest, but this volume is 158 Gvox, where one low-affinity path can chain two neurons. The guard is AGG_THRESHOLD 0.001, which is extremely conservative. If S3 reports a merge problem, WS_LOW 1e-4 costs only +0.010 VOI on the cubes and is the first thing to try."
  - "Per-chunk peak RSS scales with chunk voxels: 92.0 GB measured at 3.82e9 voxels (job 2954892) => ~24 bytes/voxel => ~37 GB at 1.53e9. ABISS concurrency IS the CPU count, so keep ncpus * per-chunk-RSS under the memory request."
  - "Storage: ~0.2 TiB scratch and ~11 GB final segmentation, scaling j0126's figures by the 4.2x smaller volume."
