# Baseline for axon_decode.yaml: the same axon affinity volume decoded with the
# established naive 3D waterz recipe for a like-for-like comparison.
#
#   python scripts/main.py --config tutorials/neuron_axon/waterz_baseline.yaml --mode test
#
# `naive_waterz` is a fixed wrapper (no knobs): decode_waterz at threshold 0.4 with
# the aff85_his256 merge function, run in 80-slice chunks and stitched at the chunk
# borders, then relabelled globally.

experiment_name: neuron_axon_waterz_baseline
description: >-
  Naive 3D waterz on an axon affinity volume, the reference point for the staged
  axon decode in axon_decode.yaml.

default:
  inference: {}
  decoding:
    # Replace with a 3-channel CZYX affinity volume ordered as (z, y, x).
    load_prediction_path: path/to/affinity.h5
    save_path: outputs/neuron_axon/waterz
    steps:
      - name: naive_waterz
  evaluation:
    enabled: true
    metrics: [nerl, nerl_oracle_merge]
    nerl_merge_threshold: 10

test:
  data:
    test:
      name: axon_volume
      # Replace with the corresponding instance-label volume.
      label: path/to/label.h5
      # No skeleton file needed: the ERL graph is derived from the label volume
      # (kimimaro at a (2,4,4) downsample) and cached beside it on first use.
      # Replace with the physical voxel size in z, y, x array-axis order.
      resolution: [1, 1, 1]
