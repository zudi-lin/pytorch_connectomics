# Axon decoding: affinity volume -> final instance segmentation.
#
# Self-contained: no `_base_` include. Every decode parameter is spelled out below at
# its starting default so tuning means editing a value rather than reading the source.
#
#   python scripts/main.py --config tutorials/neuron_axon/axon_decode.yaml --mode test
#
# Input   path/to/affinity.h5                         3-channel CZYX affinity (z,y,x)
# Output  outputs/neuron_axon/axon/<volume>/decoded_*.h5   final instance segmentation
#         outputs/neuron_axon/axon/<volume>/eval_*.txt     NERL base + oracle-merge
#
# Decode-only: no checkpoint and no GPU are needed.

experiment_name: neuron_axon_staged_decode
description: >-
  Decode axon affinities into instances: volume-unique 2D sections ->
  conservative tracklet linking -> false-merge splitting -> completion, mutual-IoU
  merging and weak-gap bridging.

default:
  # Decode-only: no inference pass. `load_prediction_path` is the affinity volume,
  # which the graph receives as its `raw` input.
  inference: {}

  decoding:
    # Replace with a 3-channel CZYX affinity volume ordered as (z, y, x).
    load_prediction_path: path/to/affinity.h5
    save_path: outputs/neuron_axon/axon

    # The pipeline as a DAG. Each stage takes [raw, <previous stage>]. Stopping
    # earlier is a one-line change: point `output` at any node. The graph prunes
    # execution to that node's ancestors and the artifact cache tag changes with it,
    # so an early stop cannot silently reuse a later artifact.
    # Every kwarg below is written at its starting default. They are spelled out
    # so they can be tuned; omit any kwarg to fall back to the same value in code.
    graph:
      nodes:
        # ---- 2D sections: waterz within each z-slice, volume-unique ids ----------
        - name: sections
          op: seg_2d
          inputs: [raw]
          kwargs:
            thr: 0.3          # waterz agglomeration threshold inside a slice
            aff_bg: 0.66      # foreground band; a voxel is section material only
                              #   above this. Lowering it admits the weak 0.30-0.66
                              #   shell, which fuses touching parallel tubes -- the
                              #   weak-gap stage below crosses that band locally instead
            aff_low: 0.01     # waterz aff_threshold_low
            small: 0          # waterz internal small-segment removal. KEEP 0 to avoid
                              #   silently dropping whole thin tubes
            num_workers: 8    # CPUs used to section slices. Slices are independent and
                              #   the id offset stays sequential, so any worker count
                              #   gives bit-identical output. -1 = every available CPU
                              #   (cgroup-aware, so it respects a SLURM allocation)

        # ---- link sections across z into tracklets -------------------------------
        - name: tracklets
          op: branch_link
          inputs: [raw, sections]
          kwargs:
            link_iou: 0.2     # conservative "spine" link: also requires mutual argmax
                              #   and in-degree 1 on both sides
            bb_iou: 0.3       # relaxed mutual best-buddy pass after the spine.
                              #   Mutual-best is merge-safe; one-sided dominance at
                              #   this stage chains adjacent neurons

        # ---- split: convert false merges into splits ------------------------------
        # A split is cheaper than a merge, so this stage deliberately converts
        # suspicious joins into fragments that the merge stage can conservatively
        # reconnect.
        - name: split
          op: branch_split
          inputs: [raw, tracklets]
          kwargs:
            drop_thr: 0.25    # cut where consecutive-slice IoU dips this far below the
                              #   median of its neighbours (adaptive, not a fixed IoU)
            w: 4              # half-window of that neighbour median
            min_size: 10000   # only segments this large are cut candidates
            min_frag: 6       # minimum slices between cuts, and from either end
            recover: 1.1      # skip a cut if slice i-1 and i+1 still overlap by more
                              #   than this. >1 disables the gate, which is the
                              #   default setting: it trades ceiling for base
            host_both: false  # tunnel carve requires the host to continue past BOTH
                              #   ends. false (relaxed) also accepts a tube emerging at
                              #   the host's terminal slice

        # ---- merge: re-link under the raised ceiling -------------------------------
        # Cross-section completion (absorb 1-slice fragments so IoU sees whole
        # cross-sections) MUST happen here and not before the split stage -- completing
        # first can hide link cuts and surrender false-merge-free headroom that the
        # merge stage cannot recover.
        - name: merged
          op: branch_merge
          inputs: [raw, split]
          kwargs:
            merge_iou: 0.45      # cross-section IoU to consider a partner at a z-seam.
                                 #   Selecting by IoU rather than by seam affinity is what
                                 #   made this stage work: strong-affinity seams are already
                                 #   merged upstream, so what is left is low-affinity, where
                                 #   shape is the only continuity signal
            margin: 0.15         # the best partner must beat the runner-up by this gap
                                 #   or the pair is LEFT SPLIT. Raise to be more
                                 #   conservative; a false merge costs far more than a
                                 #   residual split
            aff_lo: 0.4          # seam z-affinity floor. A background filter only --
                                 #   never rank partners by affinity here
            min_ov: 30           # minimum overlap area (voxels) to consider a partner
            min_size: 2000       # segments below this are absorbed as fragments by the
                                 #   completion pass rather than merged as peers
            rounds: 4            # union-find merge rounds (stops early when no merge)
            weak_max_gap: 15     # weak-gap bridge: slices to reach across
            weak_min_iou: 0.35   # projected-mask IoU required across the gap
            weak_lo: 0.3         # foreground floor along the path (the weak band)
            weak_cal_ratio: 1.6  # caliber ratio allowed between the two ends
            weak_margin: 0.15    # ambiguity margin for the bridge
            weak_min_size: 2000  # minimum segment size to bridge
            weak_rounds: 3
            weak_dim_tol: 3      # consecutive sub-weak_lo slices tolerated before the
                                 #   walk aborts
            prefer_length: false # true also runs the completion-driven radius link,
                                 #   which reaches real lateral-drift gaps but LOSES
                                 #   oracle ceiling in every configuration tested.
                                 #   Only for run-length-over-precision users

      output: merged        # sections | tracklets | split | merged

  # Scoring is optional -- drop this block and the `test:` block below to decode
  # without ground truth. `nerl` is the achieved score; `nerl_oracle_merge` relabels
  # every fragment to its majority-overlap GT, giving the false-merge-free ceiling.
  evaluation:
    enabled: true
    metrics: [nerl, nerl_oracle_merge]
    # ERL tolerates this many foreign skeleton nodes before calling a segment merged.
    # Retune this value for the density of the evaluation skeleton graph.
    nerl_merge_threshold: 10

test:
  data:
    test:
      name: axon_volume
      # Replace with the corresponding instance-label volume.
      label: path/to/label.h5
      # No skeleton file needed: the ERL graph is derived from the label volume
      # (kimimaro at a (2,4,4) downsample) and cached beside it on first use.
      # Replace with the physical voxel size in z, y, x array-axis order.
      resolution: [1, 1, 1]
